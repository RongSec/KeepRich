name: family-finance

services:
  mysql:
    image: mysql:8.0
    container_name: finance-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: ${DB_NAME:-family_finance}
      MYSQL_USER: ${DB_USER:-finance}
      MYSQL_PASSWORD: ${DB_PASSWORD:-finance_pass}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "33060:3306"
    networks:
      - finance-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance-backend
    restart: unless-stopped
    depends_on:
      - mysql
    # 不写 env_file：Compose 会自动读取同目录 .env 做变量替换，
    # 没有 .env 时全部走下面的默认值 —— 保证全新环境可以一条命令起来。
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: "8080"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-finance}
      DB_PASSWORD: ${DB_PASSWORD:-finance_pass}
      DB_NAME: ${DB_NAME:-family_finance}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      DB_PARSE_TIME: ${DB_PARSE_TIME:-true}
      DB_LOC: ${DB_LOC:-Local}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-3600}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-2592000}
      MFA_ISSUER: ${MFA_ISSUER:-FamilyFinance}
      MFA_COOLDOWN_DAYS: ${MFA_COOLDOWN_DAYS:-7}
      NOTIFY_WS_ENABLED: ${NOTIFY_WS_ENABLED:-true}
      NOTIFY_FCM_ENABLED: ${NOTIFY_FCM_ENABLED:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
    ports:
      - "28080:8080"
    networks:
      - finance-net

  admin-web:
    build:
      context: ./admin
      dockerfile: Dockerfile.web
    container_name: finance-admin-web
    restart: unless-stopped
    networks:
      - finance-net

  nginx:
    image: nginx:1.25-alpine
    container_name: finance-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - admin-web
    ports:
      - "18000:80"
      - "18443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./deploy/nginx/html:/usr/share/nginx/html:ro
    networks:
      - finance-net

volumes:
  mysql_data:

networks:
  finance-net:
    driver: bridge
