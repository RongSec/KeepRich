name: ci

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: backend/go.sum
      - name: Build & vet
        working-directory: backend
        run: |
          go mod download
          go build ./...
          go vet ./...

  app-web:
    name: App (Flutter Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.5'
      - name: Pub get
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos
      - name: Build web
        working-directory: app
        run: flutter build web --release

  admin-web:
    name: Admin (Flutter Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.5'
      - name: Pub get
        working-directory: admin
        run: flutter pub get
      - name: Analyze
        working-directory: admin
        run: flutter analyze --no-fatal-infos
      - name: Build web
        working-directory: admin
        run: flutter build web --release
