name: deploy

on:
  # 仅在打版本 tag 时部署（避免 main 首推即触发失败；配置好 Secrets 后可改回 push: main）
  push:
    tags: [ 'v*' ]

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.REGISTRY }}/family-finance/backend:${{ github.sha }}

      - name: Build & push app-web
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile.web
          push: true
          tags: ${{ secrets.REGISTRY }}/family-finance/app-web:${{ github.sha }}

      - name: Build & push admin-web
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          file: ./admin/Dockerfile.web
          push: true
          tags: ${{ secrets.REGISTRY }}/family-finance/admin-web:${{ github.sha }}

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Copy compose & nginx
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,deploy,.env"
          target: "~/family-finance"
          strip_components: 0

      - name: Pull & restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/family-finance
            export BACKEND_TAG=${{ github.sha }}
            export APP_WEB_TAG=${{ github.sha }}
            export ADMIN_WEB_TAG=${{ github.sha }}
            docker compose pull
            docker compose up -d
