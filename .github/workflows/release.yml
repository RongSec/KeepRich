name: release

# 打 v* tag 自动构建 APK 并发布到 GitHub Release（在线更新的分发源）
on:
  push:
    tags: [ 'v*' ]

jobs:
  apk:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'

      - name: Pub get
        working-directory: app
        run: flutter pub get

      # 正式签名：仓库配置 Secrets 后自动启用（KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD）
      # 未配置时回退 debug 签名（fork/贡献者无感）。见 docs/RELEASE.md 第 4 节
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/android/app/upload-keystore.jks
            cat > app/android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "release signing: enabled"
          else
            echo "release signing: fallback to debug (no KEYSTORE_BASE64 secret)"
          fi

      - name: Build APK (split per ABI)
        working-directory: app
        run: flutter build apk --release --split-per-abi --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'http://103.236.92.33:28080' }}

      - name: Generate checksums
        run: |
          cd app/build/app/outputs/flutter-apk
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/flutter-apk/SHA256SUMS.txt
