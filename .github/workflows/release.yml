name: release

# 打 v* tag 自动构建 APK 并发布到 GitHub Release（在线更新的分发源）
on:
  push:
    tags: [ 'v*' ]

jobs:
  apk:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 防止「同版本号反复覆盖发布」：App 的版本比较只看 version+buildNumber，
      # 若 tag 与 pubspec 不一致（或忘了 bump），已安装用户会永远收到"已是最新版本"。
      - name: Verify tag matches pubspec version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUB=$(grep -E '^version:' app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "tag=$TAG  pubspec=$PUB"
          if [ "$TAG" != "$PUB" ]; then
            echo "::error::tag v$TAG 与 pubspec version $PUB 不一致。发版必须先 bump app/pubspec.yaml 的版本号，禁止同号覆盖。"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'

      - name: Pub get
        working-directory: app
        run: flutter pub get

      # 正式签名：仓库配置 Secrets 后自动启用（KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD）
      # 未配置时回退 debug 签名（fork/贡献者无感）。见 docs/RELEASE.md 第 4 节
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/android/app/upload-keystore.jks
            cat > app/android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "release signing: enabled"
          else
            echo "release signing: fallback to debug (no KEYSTORE_BASE64 secret)"
          fi

      - name: Build APK (split per ABI)
        working-directory: app
        # 不注入 API_BASE_URL：服务端地址由用户在 App 内配置/扫码，硬编码公网 IP
        # 会让 CI 包与随部署分发的包不一致（且该地址未必可达）
        run: flutter build apk --release --split-per-abi

      - name: Generate checksums
        run: |
          cd app/build/app/outputs/flutter-apk
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/flutter-apk/SHA256SUMS.txt
