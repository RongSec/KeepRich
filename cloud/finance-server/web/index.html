<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- Flutter Web 需要：wasm-unsafe-eval（canvaskit wasm 编译）、
         unsafe-inline（flutter_bootstrap 内联脚本）、gstatic（canvaskit 引擎资源） -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.gstatic.com https://fonts.gstatic.com; base-uri 'self'; form-action 'self'; object-src 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">

  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="家庭与个人财务管理系统 · 永远富裕">
  <meta name="theme-color" content="#07070B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="永远富裕">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <title>永远富裕</title>
  <style>
    /* 首屏兜底：Flutter 引擎就绪前先铺一层深色 + 金色标语，避免白屏闪烁 */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(120% 80% at 50% 100%, #1c1509 0%, #0d0d13 55%, #07070b 100%);
      overflow: hidden;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      color: #ffc65c;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      transition: opacity .45s ease;
    }
    #boot .coin {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle at 34% 30%, #fff6d2, #f6ce6f 42%, #dca331 82%, #a9741a);
      box-shadow: 0 0 30px rgba(255, 198, 92, .45);
      animation: spin 3.2s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 900;
      color: #8e6012;
    }
    #boot .txt { font-size: 15px; letter-spacing: 6px; color: #ffe3a3; }
    #boot .sub { font-size: 11px; letter-spacing: 3px; color: rgba(169, 164, 152, .8); }
    @keyframes spin {
      0%, 100% { transform: rotateY(0deg) }
      50% { transform: rotateY(180deg) }
    }
    .hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="boot">
    <div class="coin">¥</div>
    <div class="txt">永远富裕</div>
    <div class="sub">FAMILY FINANCE</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter 首帧渲染后移除兜底层
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('hidden');
      setTimeout(function () { boot.remove(); }, 500);
    });
  </script>
</body>
</html>
