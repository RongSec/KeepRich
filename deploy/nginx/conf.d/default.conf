server {
    listen 80;
    server_name _;

    # 后端 API
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Swagger 文档
    location /swagger/ {
        proxy_pass http://backend:8080/swagger/;
        proxy_set_header Host $host;
    }

    # ===== App Web（Flutter Web 构建产物） =====
    # 把 scripts/build_web.sh 的产物放到 deploy/nginx/html/app 即可上线；
    # 入口文件强制不缓存，保证发布后用户刷新就能拿到新版本。
    location /app/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache";
    }

    location = /app/index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location ~* /app/(flutter_bootstrap|flutter_service_worker|main\.dart)\.js$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    location = /app/version.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
        expires -1;
    }

    # 管理后台 Web（根路径）
    location / {
        proxy_pass http://admin-web:80/;
        proxy_set_header Host $host;
    }
}
